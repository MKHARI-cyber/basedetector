name: Build Fabric Mod Jar

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BaseDetectorClient

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build

      - name: Upload Compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: compiled-fabric-mod
          path: BaseDetectorClient/build/libs/*.jar
